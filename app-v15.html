<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>NakNak v15</title>
<style>
html,body{margin:0;min-height:100%;background:#080402;font-family:system-ui,-apple-system,sans-serif;color:#fff}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 25% 25%,#2A0A00 0%,#080402 65%)}
#boot strong{display:block;font-size:24px;margin-bottom:8px}#boot span{font-size:13px;opacity:.7}
</style>
</head>
<body>
<div id="boot"><div><strong>NakNak v15</strong><span>Pinning emergency navigation…</span></div></div>
<script>
(async function(){
 try{
  const res=await fetch('./app-v14.html',{cache:'no-store'});
  if(!res.ok) throw new Error('Unable to load NakNak v14');
  let wrapper=await res.text();

  const navPatch=String.raw`
  // V15: reserve a permanent bottom-nav zone inside the Senior/PWD home viewport.
  const v15css=\`<style id="naknak-v15-nav-fix">
[data-nak-home-v14="1"]{position:relative!important;padding-bottom:90px!important;box-sizing:border-box!important;overflow:hidden!important}
[data-nak-home-v14="1"] .nak-home-nav{position:absolute!important;left:0!important;right:0!important;bottom:0!important;z-index:80!important;background:inherit!important}
[data-nak-home-v14="1"] .nak-home-nav>div{padding-top:5px!important;padding-bottom:8px!important;background:inherit!important}
[data-nak-home-v14="1"] .nak-home-main{padding-bottom:4px!important}
body[data-nak-mobility="1"] [data-nak-home-v14="1"] .nak-home-nav button{min-height:42px!important}
@media (max-height:860px){
 [data-nak-home-v14="1"] .nak-home-sos{width:188px!important;height:188px!important}
 [data-nak-home-v14="1"] .nak-home-helper{padding:7px 10px!important;margin-top:2px!important;margin-bottom:3px!important}
 [data-nak-home-v14="1"] .nak-home-update{padding:7px 10px!important;margin-top:2px!important;margin-bottom:3px!important}
 [data-nak-home-v14="1"] .nak-home-main{gap:5px!important;padding-top:2px!important}
}
@media (max-height:780px){
 [data-nak-home-v14="1"] .nak-home-sos{width:170px!important;height:170px!important}
 [data-nak-home-v14="1"] .nak-home-note-preview{display:none!important}
}
@media (max-height:700px){
 [data-nak-home-v14="1"] .nak-home-helper{display:none!important}
 [data-nak-home-v14="1"] .nak-home-sos{width:154px!important;height:154px!important}
}
</style>\`;
  src=src.replace('</head>',v15css+'\\n</head>');
  rep('NakNak v14 — One-screen Emergency Home','NakNak v15 — Pinned Emergency Navigation');
`;

  // Never place a literal closing-script token inside this script block.
  // HTML parsers terminate a script element even when that token appears inside a JS string.
  const closeScript='<'+'/script>';
  const openScript='<script>';
  const marker=closeScript+'\n\n'+openScript+'\n(async function(){';
  if(!wrapper.includes(marker)) throw new Error('NakNak v14 patch marker not found');
  wrapper=wrapper.replace(marker,navPatch+'\n'+closeScript+'\n\n'+openScript+'\n(async function(){');
  wrapper=wrapper.replace(/NakNak v14/g,'NakNak v15');
  document.open();document.write(wrapper);document.close();
 }catch(err){document.getElementById('boot').innerHTML='<div><strong>Hindi ma-load ang NakNak</strong><span>'+String(err.message||err)+'</span></div>';}
})();
</script>
</body>
</html>
