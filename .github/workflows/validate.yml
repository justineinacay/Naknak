name: Validate NakNak

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install native dependencies
        working-directory: native
        run: pnpm install --no-frozen-lockfile

      - name: Refresh lockfile when Expo patches changed
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- native/pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add native/pnpm-lock.yaml
            git commit -m "Refresh native lockfile for Expo SDK 57"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Typecheck native app
        working-directory: native
        run: pnpm typecheck

      - name: Lint native app
        working-directory: native
        run: pnpm lint

      - name: Expo Doctor
        working-directory: native
        run: pnpm dlx expo-doctor

      - name: Export Expo web build
        working-directory: native
        run: pnpm exec expo export --platform web

      - name: Verify web safety build
        run: node scripts/verify-web.mjs
