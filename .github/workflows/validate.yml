name: Validate NakNak

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate website and Family Dashboard
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import vm from 'node:vm';

          const landing = readFileSync('index.html', 'utf8');
          const family = readFileSync('family-dashboard.html', 'utf8');
          const hasCompleteHTML = (html) =>
            /<!doctype html>/i.test(html) && /<body\b/i.test(html) && /<\/body>/i.test(html) && /<\/html>/i.test(html);
          const scriptsParse = (html, label) => {
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
            try {
              for (const [index, script] of scripts.entries()) {
                if (/\bsrc=/.test(script[1]) || /\btype=["'](?:application\/json|text\/babel)["']/.test(script[1])) continue;
                new vm.Script(script[2], { filename: label + ':inline-script-' + index });
              }
              return true;
            } catch (error) {
              console.error(label + ': ' + error.message);
              return false;
            }
          };
          const checks = [
            ['website HTML is complete', hasCompleteHTML(landing)],
            ['Family Dashboard HTML is complete', hasCompleteHTML(family)],
            ['website JavaScript parses', scriptsParse(landing, 'index.html')],
            ['Family Dashboard JavaScript parses', scriptsParse(family, 'family-dashboard.html')],
            ['website links to the NakNak app', /href=["'][^"']*(?:naknak-app|app)\.html["']/.test(landing)],
            ['website links to Family Dashboard', /href=["']family-dashboard\.html["']/.test(landing)],
            ['app and advanced dashboard files exist', ['app.html','naknak-app.html','dashboard.html'].every(existsSync)],
            ['Free and Family pricing displayed', landing.includes('₱199') && landing.includes('₱1,990')],
            ['paid features are not represented as active', /Paid subscriptions and the full Family feature set are not active/.test(landing)],
            ['unimplemented safety features are clearly disclosed', /Remote caregiver push notifications, automatic location sharing, and fall detection are not active/.test(landing)],
            ['Family Dashboard requires authenticated household access', family.includes('signInWithOtp') && family.includes('naknak_household_members')],
            ['site and dashboard contain privacy referrer policy', [landing,family].every(s=>s.includes('strict-origin-when-cross-origin'))],
          ];
          for (const [name, ok] of checks) console.log((ok ? 'PASS' : 'FAIL') + ' ' + name);
          if (checks.some(([, ok]) => !ok)) process.exitCode = 1;
          NODE

      # A website-only pull request should not fail due to unrelated native SDK drift.
      # Native Expo checks run when native app/build inputs change.
      # Backend migrations still run web safety checks without unrelated Expo drift.
      - name: Detect changes requiring native validation
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "web_safety=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(native/|web-src/|scripts/build-web\.mjs$|app(-v15)?\.html$|naknak-app\.html$|manifest\.webmanifest$|naknak-sw\.js$)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq '^(native/|web-src/|scripts/(build-web|verify-web)\.mjs$|app(-v15)?\.html$|naknak-app\.html$|dashboard\.html$|functions/|supabase/|manifest\.webmanifest$|naknak-sw\.js$)'; then
            echo "web_safety=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_safety=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Verify new household operations boundaries
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const sql=readFileSync('supabase/migrations/20261031090000_household_prep_and_support.sql','utf8');
          const html=readFileSync('family-dashboard.html','utf8');
          const tests=[
            ['prep RLS enabled',sql.includes('naknak_household_prep enable row level security')],
            ['support RLS enabled',sql.includes('naknak_support_requests enable row level security')],
            ['anon revoked for both tables',(sql.match(/revoke all on table public\.naknak_\w+ from anon,authenticated/g)||[]).length===2],
            ['policies use authenticated household membership',sql.includes('auth_uid = (select auth.uid())')],
            ['support requests cannot be updated by browser',!sql.includes('grant update on table public.naknak_support_requests')],
            ['connection checks do not assert emergency delivery',html.includes('It does not confirm that a caregiver received an alert')],
            ['prep falls back to explicit browser-only draft',html.includes('Saved to this browser only')],
            ['support errors do not claim request saved',html.includes('No request was submitted')],
            ['new household sections are present',['connection','carehub','access','sharedprep','helpdesk'].every(id=>html.includes('id="view-'+id+'"'))],
          ];
          for(const [name,ok] of tests)console.log((ok?'PASS ':'FAIL ')+name);
          if(tests.some(([,ok])=>!ok))process.exitCode=1;
          NODE

      - name: Enable Corepack
        if: steps.scope.outputs.native == 'true'
        run: corepack enable

      - name: Install native dependencies
        if: steps.scope.outputs.native == 'true'
        working-directory: native
        run: pnpm install --frozen-lockfile

      - name: Typecheck native app
        if: steps.scope.outputs.native == 'true'
        working-directory: native
        run: pnpm typecheck

      - name: Lint native app
        if: steps.scope.outputs.native == 'true'
        working-directory: native
        run: pnpm lint

      - name: Expo Doctor
        if: steps.scope.outputs.native == 'true'
        working-directory: native
        run: pnpm dlx expo-doctor

      - name: Export Expo web build
        if: steps.scope.outputs.native == 'true'
        working-directory: native
        run: pnpm exec expo export --platform web

      - name: Verify web safety build
        if: steps.scope.outputs.web_safety == 'true'
        run: node scripts/verify-web.mjs
