<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>NakNak v14</title>
<style>
html,body{margin:0;min-height:100%;background:#080402;font-family:system-ui,-apple-system,sans-serif;color:#fff}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 25% 25%,#2A0A00 0%,#080402 65%)}
#boot strong{display:block;font-size:24px;margin-bottom:8px}#boot span{font-size:13px;opacity:.7}
</style>
</head>
<body>
<div id="boot"><div><strong>NakNak v14</strong><span>Optimizing the emergency home screen…</span></div></div>

<script type="text/plain" id="v14-patch">
  // V14: the Senior/PWD emergency home must fit in one viewport with navigation always visible.
  rep('overflow:"hidden",zoom:textScale','overflow:"hidden",zoom:screen===SR.HOME?1:textScale');

  src=src.replace(/function SeniorHome\([\s\S]*?\n}\n\nfunction SOSButton/,`function SeniorHome({ name, goTo, t, plan, senior, a11y, lang, textScale, setTextScale }) {
 const i = I18N[lang] || I18N.tl;
 const noteCount = (senior?.notes||[]).length;
 const latestNote = (senior?.notes||[])[0];
 const zone = senior?.safeZone;
 const updateCount = noteCount + ((senior?.vitals||[]).length>0?1:0) + (zone?1:0);
 const badges = [
  a11y.mobility&&{label:"Mobility",icon:"accessible",color:"#E65100"},
  a11y.cognitive&&{label:"Cognitive",icon:"brain",color:"#2E7D32"},
  a11y.vision&&{label:"Visual",icon:"eye",color:"#6B35C4"},
  a11y.hearing&&{label:"Hearing",icon:"ear",color:"#2196A8"}
 ].filter(Boolean);
 return (
  <div data-nak-home-v14="1" style={{flex:1,display:"flex",flexDirection:"column",minHeight:0,height:"100%",maxHeight:"100%",overflow:"hidden",background:t.bg}}>
   <div className="nak-home-head" style={{flex:"0 0 auto",padding:"10px 16px 5px"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
     <div style={{minWidth:0}}>
      <div style={{fontSize:12,color:t.text3,fontWeight:700}}>{i.goodMorning}</div>
      <div style={{fontSize:a11y.vision?25:23,color:t.text,fontWeight:900,display:"flex",alignItems:"center",gap:6,lineHeight:1.05}}>{name}<Icon name="heart" size={17} color={t.red}/></div>
     </div>
     {senior?.battery<20&&<div style={{flexShrink:0,background:t.warnBg,border:`1px solid ${t.warnBorder}`,borderRadius:12,padding:"6px 10px",display:"flex",alignItems:"center",gap:5}}><Icon name="alert_tri" size={13} color={t.warn}/><span style={{fontSize:10.5,fontWeight:900,color:t.warn}}>{i.batteryLow}</span></div>}
    </div>
    {badges.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:7}}>{badges.map(b=><div key={b.label} style={{display:"flex",alignItems:"center",gap:4,padding:"3px 8px",borderRadius:99,background:b.color+"12",border:"1px solid "+b.color+"55",color:b.color,fontSize:9.5,fontWeight:900}}><Icon name={b.icon} size={11} color={b.color}/>{b.label}</div>)}</div>}
   </div>

   {a11y.cognitive&&<div className="nak-home-helper" style={{flex:"0 0 auto",margin:"4px 16px 5px",padding:"9px 12px",background:t.isDark?"rgba(46,125,50,0.12)":"#F1FFF5",borderRadius:13,border:"1.5px solid #2E7D3244",display:"flex",alignItems:"center",gap:8}}><Icon name="brain" size={16} color="#2E7D32"/><div style={{fontSize:11.5,fontWeight:850,color:"#2E7D32",lineHeight:1.3}}>{i.cognitiveHelper||"Kung kailangan mo ng tulong, pindutin ang malaking pulang bilog."}</div></div>}

   {updateCount>0&&<button className="nak-home-update nak-home-compact-button" onClick={()=>goTo(SR.UPDATES)} style={{flex:"0 0 auto",margin:"4px 16px 5px",padding:"9px 12px",minHeight:0,borderRadius:14,background:t.isDark?"rgba(46,140,74,0.12)":"#F1FFF5",border:`1.5px solid ${t.greenBorder}`,cursor:"pointer",display:"flex",alignItems:"center",gap:9,textAlign:"left"}}>
    <Icon name="hand_heart" size={19} color={t.green}/>
    <div style={{flex:1,minWidth:0}}><div style={{fontSize:12.5,fontWeight:900,color:t.green}}>{updateCount===1?i.updatesBannerOne:i.updatesBanner(updateCount)}</div>{latestNote&&<div className="nak-home-note-preview" style={{fontSize:10.5,color:t.text3,fontWeight:650,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>"{latestNote.text}"</div>}</div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={t.green} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
   </button>}

   <div className="nak-home-main" style={{flex:"1 1 auto",minHeight:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"space-between",padding:"5px 16px 8px",gap:7}}>
    <div className="nak-home-sos-wrap" style={{flex:"1 1 auto",minHeight:0,width:"100%",display:"flex",alignItems:"center",justifyContent:"center"}}>
     <button className="nak-home-sos" onClick={()=>goTo(SR.SOS_ACTIVE)} style={{width:"clamp(174px,27vh,212px)",height:"clamp(174px,27vh,212px)",minHeight:0,borderRadius:"50%",background:t.redGrad,border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,boxShadow:`0 16px 46px ${t.redGlow},0 6px 18px rgba(0,0,0,0.16),inset 0 1px 0 rgba(255,255,255,0.22)`,color:"#fff",padding:18}}>
      <span style={{fontSize:a11y.vision?42:39,fontWeight:900,letterSpacing:-1,lineHeight:1}}>NakNak</span>
      <span style={{fontSize:a11y.cognitive?12.5:11.5,fontWeight:850,textAlign:"center",lineHeight:1.25,maxWidth:150}}>{a11y.cognitive?i.sosBtnCognitive:i.sosBtn}</span>
     </button>
    </div>

    <div className="nak-home-actions" style={{flex:"0 0 auto",width:"100%",display:"flex",flexDirection:"column",gap:7}}>
     <button onClick={()=>goTo(SR.CHECKIN)} style={{height:a11y.mobility?64:58,minHeight:0,borderRadius:32,background:t.green,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:9,boxShadow:`0 7px 22px ${t.greenGlow}`,fontSize:a11y.vision?23:21,fontWeight:900,color:"#fff"}}><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>{i.ayosAko}</button>
     <button className="nak-home-rescue" onClick={()=>goTo(SR.RESCUE)} style={{height:a11y.mobility?54:50,minHeight:0,borderRadius:27,background:t.warnBg,border:`2px solid ${t.warnBorder}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:7,fontSize:a11y.vision?16:14.5,fontWeight:900,color:t.warn}}>{i.rescueBridge}</button>
    </div>
   </div>

   <div className="nak-home-nav" style={{flex:"0 0 auto",minHeight:0}}><SeniorNav active="home" goTo={goTo} t={t} plan={plan} lang={lang}/></div>
  </div>
 );
}

function SOSButton`);

  const v14css=`<style id="naknak-v14-home-css">
[data-nak-home-v14="1"]{overflow:hidden!important;overscroll-behavior:none}
[data-nak-home-v14="1"] .nak-home-nav button,[data-nak-home-v14="1"] .nak-home-nav a{min-height:42px!important}
body[data-nak-mobility="1"] [data-nak-home-v14="1"] .nak-home-compact-button{min-height:0!important}
body[data-nak-mobility="1"] [data-nak-home-v14="1"] .nak-home-nav button{min-height:42px!important}
body[data-nak-mobility="1"] [data-nak-home-v14="1"] .nak-home-rescue{min-height:0!important}
@media (max-height:760px){
 [data-nak-home-v14="1"] .nak-home-head{padding-top:7px!important;padding-bottom:2px!important}
 [data-nak-home-v14="1"] .nak-home-helper{padding:7px 10px!important;margin-top:2px!important;margin-bottom:3px!important}
 [data-nak-home-v14="1"] .nak-home-update{padding:7px 10px!important;margin-top:2px!important;margin-bottom:3px!important}
 [data-nak-home-v14="1"] .nak-home-sos{width:176px!important;height:176px!important}
 [data-nak-home-v14="1"] .nak-home-main{padding-top:2px!important;padding-bottom:5px!important}
}
@media (max-height:680px){
 [data-nak-home-v14="1"] .nak-home-helper{display:none!important}
 [data-nak-home-v14="1"] .nak-home-note-preview{display:none!important}
 [data-nak-home-v14="1"] .nak-home-sos{width:158px!important;height:158px!important}
 [data-nak-home-v14="1"] .nak-home-actions{gap:5px!important}
}
</style>`;
  src=src.replace('</head>',v14css+'\n</head>');

  // The old fixed beta disclosure could cover the emergency navigation. Keep the existing top BETA banner instead.
  src=src.replace(/<div id="naknak-v13-safety"[\s\S]*?<\/div>/,'');
  rep('NakNak v13 — Senior/PWD + Caregiver/Anak','NakNak v14 — One-screen Emergency Home');
</script>

<script>
(async function(){
 try{
  const res=await fetch('./app-v13.html',{cache:'no-store'});
  if(!res.ok)throw new Error('Unable to load NakNak v13');
  let wrapper=await res.text();
  const patch=document.getElementById('v14-patch').textContent;
  const needle='  document.open();document.write(src);document.close();';
  if(!wrapper.includes(needle))throw new Error('NakNak patch point not found');
  wrapper=wrapper.replace(needle,patch+'\n'+needle);
  wrapper=wrapper.replace(/NakNak v13/g,'NakNak v14');
  document.open();document.write(wrapper);document.close();
 }catch(err){document.getElementById('boot').innerHTML='<div><strong>Hindi ma-load ang NakNak</strong><span>'+String(err.message||err)+'</span></div>';}
})();
</script>
</body>
</html>
